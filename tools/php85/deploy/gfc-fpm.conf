; Copy to /etc/php/8.5/fpm/pool.d/gfc.conf after following INSTALL.md.
; Keep other PHP versions and pools unchanged.
[gfc]
user = www-data
group = www-data
listen = /run/php/php8.5-fpm-gfc.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = 5
pm.process_idle_timeout = 10s
pm.max_requests = 500
request_terminate_timeout = 180s
clear_env = yes
security.limit_extensions = .php
catch_workers_output = yes

env[CI_ENV] = production
; Set only when using a TNS alias and a separate network configuration folder:
; env[TNS_ADMIN] = /etc/oracle/network/admin

php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_flag[short_open_tag] = off
php_admin_flag[register_argc_argv] = off
php_admin_flag[cgi.fix_pathinfo] = off
php_admin_value[default_charset] = UTF-8
php_admin_value[memory_limit] = 512M
php_admin_value[upload_max_filesize] = 40M
php_admin_value[post_max_size] = 48M
php_admin_value[max_execution_time] = 120
php_admin_value[max_input_time] = 120
php_admin_value[session.save_path] = /var/lib/php/gfc-sessions
php_admin_value[upload_tmp_dir] = /var/lib/php/gfc-tmp
; Replace this with the OLD server's timezone before enabling the pool.
; Europe/Berlin is the current Windows project's setting, not a migration requirement.
php_admin_value[date.timezone] = Europe/Berlin
