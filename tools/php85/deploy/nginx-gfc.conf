# Include INSIDE the existing HTTPS server {} block after following INSTALL.md.
# The release contains /srv/gfc/releases/php-8.5.12/gfc/index.php.
# Replace existing /gfc locations; do not define the same location twice.
location = /gfc {
    return 301 /gfc/$is_args$args;
}

location ^~ /gfc/ {
    root /srv/gfc/releases/php-8.5.12;
    index index.php;
    client_max_body_size 48m;
    autoindex off;

    # Nginx does not read the project's Apache .htaccess files.
    location ~ ^/gfc/(application|system|vendor|tools|tests|temp|database|scratch)(/|$) {
        return 404;
    }
    location ~ /\. {
        return 404;
    }
    location ~* ^/gfc/(composer\.(json|lock)|README\.md|INSTALL\.md|HANDOFF\.md|unbom\.exe)$ {
        return 404;
    }
    location ~* \.(bak[^/]*|bkp[^/]*|old|orig|sql|ini|log)$ {
        return 404;
    }
    # Uploaded files are never PHP entry points.
    location ~* ^/gfc/(uploads|assets/da3em/img/uploads)/.*\.(php[0-9]*|phtml|phar)(/|$) {
        return 404;
    }

    # Keep existing direct entry points such as tutorial/tutorial_show.php.
    location ~ ^/gfc/.+\.php(/|$) {
        fastcgi_split_path_info ^(/gfc/.+?\.php)(/.*)$;
        set $gfc_path_info $fastcgi_path_info;
        try_files $fastcgi_script_name =404;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $gfc_path_info;
        fastcgi_param CI_ENV production;
        fastcgi_read_timeout 180s;
        fastcgi_pass unix:/run/php/php8.5-fpm-gfc.sock;
    }

    try_files $uri $uri/ /gfc/index.php?$query_string;
}
